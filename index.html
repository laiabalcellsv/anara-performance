<style>
/* Layout: one phone-first column for a creator's own numbers; the same column, a bit wider, with a compact team table for leads, Alba and Laia. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --ink: #161922;
  --muted: #5B6273;
  --line: #E0E3EA;
  --track: #E7EAF0;
  --accent: #3242D4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8EAFC;
  --ok: #17784D;
  --ok-soft: #E1F2E9;
  --warn: #965800;
  --warn-soft: #FAEED7;
  --bad: #BF352B;
  --bad-soft: #FAE5E3;
  --f-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1015; --surface: #171A22; --ink: #ECEEF4; --muted: #9AA1B2; --line: #272B36; --track: #262A35;
    --accent: #8F9BFF; --accent-ink: #0E1015; --accent-soft: #222747;
    --ok: #4CC38A; --ok-soft: #11301F; --warn: #EBA53D; --warn-soft: #33250E; --bad: #FF7067; --bad-soft: #3B1714;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1015; --surface: #171A22; --ink: #ECEEF4; --muted: #9AA1B2; --line: #272B36; --track: #262A35;
  --accent: #8F9BFF; --accent-ink: #0E1015; --accent-soft: #222747;
  --ok: #4CC38A; --ok-soft: #11301F; --warn: #EBA53D; --warn-soft: #33250E; --bad: #FF7067; --bad-soft: #3B1714;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.yap { max-width: 640px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.yap.is-mid { max-width: 820px; }
.yap *, .yap *::before, .yap *::after { box-sizing: border-box; }
.yap h1, .yap h2, .yap h3, .yap p { margin: 0; }
.yap a { color: inherit; }
:where(.yap) button, :where(.yap) input, :where(.yap) select { font: inherit; color: inherit; }
.yap :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.yap-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.yap-num, .yap-big b, .yap-wk-v, .yt-c { font-variant-numeric: tabular-nums; }

/* log in */
.yap-login { display: flex; flex-direction: column; gap: 14px; padding-top: 6vh; }
.yap-title { font-family: var(--f-display); font-weight: 650; font-size: clamp(34px, 9vw, 52px); line-height: 1.02; letter-spacing: -.02em; text-wrap: balance; }
.yap-lede { font-size: 17px; color: var(--muted); max-width: 46ch; text-wrap: pretty; }
.yap-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.yap-card--form { margin-top: 6px; }
.yap-form { display: flex; flex-direction: column; gap: 10px; }
.yap-label { font-weight: 600; font-size: 14px; }
.yap-input { width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.yap-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.yap-check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; }
.yap-check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.yap-btn { appearance: none; border: 0; border-radius: 12px; padding: 13px 16px; background: var(--accent); color: var(--accent-ink); font-weight: 650; font-size: 16px; cursor: pointer; }
.yap-btn:disabled { opacity: .6; cursor: progress; }
.yap-err { color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.yap-foot, .yap-hint { font-size: 13px; color: var(--muted); }
.yap-loading { padding: 18vh 0; text-align: center; color: var(--muted); }

/* top bar */
.yap-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
.yap-top-l { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.yap-hi { font-family: var(--f-display); font-weight: 650; font-size: clamp(30px, 8vw, 42px); line-height: 1.05; letter-spacing: -.02em; overflow-wrap: anywhere; }
.yap-meta { font-size: 14px; color: var(--muted); }
.yap-link { appearance: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
.yap-link:hover { color: var(--ink); border-color: var(--muted); }

/* cards */
.yap-card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.yap-card-h h2 { font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.yap-sub { font-size: 13px; color: var(--muted); }
.yap-big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.yap-big b { font-family: var(--f-display); font-weight: 650; font-size: clamp(44px, 13vw, 60px); line-height: 1; letter-spacing: -.02em; }
.yap-big span { font-size: 17px; color: var(--muted); }
.yap-meter { position: relative; height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.yap-meter i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
.yap-meter i.is-done { background: var(--ok); }
.yap-note { font-size: 15px; }
.yap-groups { display: flex; flex-direction: column; gap: 16px; }
.yap-code { font-size: 24px; letter-spacing: 6px; font-variant-numeric: tabular-nums; }
.yap-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 0; }
.yap-info { color: var(--muted); font-size: 14px; }
.yap-plan { border-color: var(--accent); }
.yap-plan-intro { font-weight: 600; }
.yap-step { display: flex; flex-direction: column; gap: 6px; }
.yap-step-h { display: flex; align-items: center; gap: 8px; }
.yap-step-n { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; flex: none; }
.yap-step-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.5; max-width: 70ch; }
.yap-tag--plan { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-size: 11px; font-weight: 700; white-space: nowrap; }
.yt-plan { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.yap-asbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.yap-flag { font-size: 14px; background: var(--accent-soft); border-radius: 10px; padding: 9px 12px; }

.yap-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.yap-pill--ok { background: var(--ok-soft); color: var(--ok); }
.yap-pill--warn { background: var(--warn-soft); color: var(--warn); }
.yap-pill--bad { background: var(--bad-soft); color: var(--bad); }
.yap-pill--accent { background: var(--accent-soft); color: var(--accent); }
.yap-pill--muted { background: var(--track); color: var(--muted); }

.yap-kv { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 12px 14px; align-items: baseline; margin: 0; }
.yap-kv dt { color: var(--muted); font-size: 14px; }
.yap-kv dd { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.yap-kv dd b { font-weight: 650; }
.yap-vid { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.yap-vid:hover { border-color: var(--accent); color: var(--accent); }
.yap-vid::after { content: "\2197"; font-size: 12px; color: var(--muted); }
.yap-rule { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.yap-warnline { font-size: 14px; color: var(--warn); }
.yap-vids { display: flex; flex-wrap: wrap; gap: 8px; }

.yap-weeks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.yap-wk { border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 3px; background: var(--track); min-width: 0; }
.yap-wk.is-ok { background: var(--ok-soft); }
.yap-wk.is-bad { background: var(--bad-soft); }
.yap-wk.is-warn { background: var(--warn-soft); }
.yap-wk-l { font-size: 12px; color: var(--muted); line-height: 1.2; min-height: 2.4em; }
.yap-wk-v { font-family: var(--f-display); font-weight: 650; font-size: 21px; line-height: 1.1; }
.yap-wk-t { font-size: 12px; font-weight: 600; }
.yap-wk.is-ok .yap-wk-t { color: var(--ok); }
.yap-wk.is-bad .yap-wk-t { color: var(--bad); }
.yap-wk.is-warn .yap-wk-t { color: var(--warn); }
.yap-wk.is-none .yap-wk-t { color: var(--muted); font-weight: 500; }
.yap-wk.is-paused { background: repeating-linear-gradient(135deg, var(--track) 0 6px, var(--surface) 6px 12px); }
.yap-wk.is-paused .yap-wk-v { color: var(--muted); font-size: 18px; }
.yap-wk.is-paused .yap-wk-t { color: var(--muted); font-weight: 500; }
.yap-wk-n { font-size: 11px; color: var(--muted); }
.yap-wk-n.is-low { color: var(--warn); font-weight: 700; }
.yap-statusline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; }

/* creator's simple team ranking */
.yap-team { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.yap-team li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) 5em 4.8em 4.8em; gap: 8px; align-items: center; padding: 9px 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
.yap-team li:last-child { border-bottom: 0; }
.yap-team .yap-team-h { font-size: 12px; font-weight: 600; color: var(--muted); padding-block: 4px 6px; line-height: 1.2; }
.yap-team .yap-team-h .yap-num { white-space: normal; }
.yap-team .is-you { background: var(--accent-soft); border-radius: 10px; border-bottom-color: transparent; font-weight: 650; }
.yap-team .yap-num { text-align: right; white-space: nowrap; }
.yap-rank { color: var(--muted); font-size: 13px; text-align: right; }
.yap-tname { overflow-wrap: anywhere; }
.is-hit { color: var(--ok); font-weight: 650; }
.is-miss { color: var(--bad); }

/* compact team table (leads, Alba, Laia): one line per creator, tap for details */
.yt { display: flex; flex-direction: column; }
.yt-row { display: grid; grid-template-columns: minmax(0, 2fr) repeat(5, minmax(0, .8fr)) minmax(0, 1fr); gap: 6px; align-items: center; padding: 7px 6px; }
.yt-head { font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.2; padding-block: 0 6px; border-bottom: 1px solid var(--line); }
.yt-head .yt-c { background: none; font-weight: 600; font-size: 11px; white-space: normal; }
.yt-head .yt-c5 { color: var(--accent); }
.yt-head .yt-due { justify-content: flex-end; }
.yt-short { display: none; }
.yt-item { border-bottom: 1px solid var(--line); }
.yt-item:last-child { border-bottom: 0; }
.yt-item > summary { list-style: none; cursor: pointer; border-radius: 10px; }
.yt-item > summary::-webkit-details-marker { display: none; }
.yt-item > summary:hover { background: var(--bg); }
.yt-item[open] > summary { background: var(--accent-soft); }
.yt-who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.yt-name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; min-width: 0; }
.yt-name .yt-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.yt-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 15px; }
.yt-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.yt-dot--ok { background: var(--ok); }
.yt-dot--warn { background: var(--warn); }
.yt-dot--bad { background: var(--bad); }
.yt-dot--accent { background: var(--accent); }
.yt-dot--muted { background: var(--line); box-shadow: inset 0 0 0 1px var(--muted); }
.yt-c { text-align: center; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 4px 2px; white-space: nowrap; }
.yt-c.is-ok { color: var(--ok); background: var(--ok-soft); }
.yt-c.is-bad { color: var(--bad); background: var(--bad-soft); }
.yt-c.is-none { color: var(--muted); font-weight: 500; }
.yt-c.is-cur { color: var(--accent); background: var(--accent-soft); }
.yt-c small { display: block; font-size: 10px; font-weight: 500; line-height: 1.15; color: var(--muted); white-space: nowrap; }
.yt-c small.is-low { color: var(--warn); font-weight: 700; }
.yt-c.is-paused { color: var(--muted); font-weight: 500; font-size: 12px; background: repeating-linear-gradient(135deg, var(--track) 0 5px, transparent 5px 10px); }
.yt-due { display: flex; justify-content: flex-end; min-width: 0; }
.yt-due .yap-pill { font-size: 12px; padding: 2px 8px; }
.yt-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 22px; padding: 12px 8px 16px; }
.yt-dcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.yt-detail .yap-kv { grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr); gap: 8px 12px; }
.yap-dh { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.yt-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.yt-legend span { display: inline-flex; align-items: center; gap: 6px; }
.yt-teamh { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.yt-teamh h2 { font-family: var(--f-display); font-size: 21px; font-weight: 650; letter-spacing: -.01em; }

/* everyone (Laia, Alba) */
.yap-summary { font-size: 17px; max-width: 64ch; text-wrap: pretty; }
.yap-summary b { font-weight: 650; }
.yap-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.yap-search { flex: 1 1 240px; min-width: 0; }
.yap-select { min-width: 0; max-width: 100%; padding: 9px 44px 9px 14px; border-radius: 12px; border: 1px solid var(--line); background-color: var(--surface); color: var(--ink); font-size: 15px; cursor: pointer; appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 23px) 50%, calc(100% - 18px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.yap-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.yap-chip { appearance: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.yap-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.yap-empty { padding: 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }

.yap-how { border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); }
.yap-how summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.yap-how ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; line-height: 1.5; font-size: 14px; }

@media (max-width: 640px) {
  .yap-kv { grid-template-columns: 1fr; gap: 4px; }
  .yap-kv dd { margin-bottom: 8px; }
  .yap-wk { padding: 8px; }
  .yap-wk-v { font-size: 17px; }
  .yap-wk.is-paused .yap-wk-v { font-size: 14px; }
  .yap-team li { grid-template-columns: 1.3em minmax(0, 1fr) 3.6em 3.9em 3.9em; gap: 6px; font-size: 13px; padding: 9px 4px; }
  .yt-row { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-areas: "who who who due due" "c1 c2 c3 c4 c5"; row-gap: 6px; column-gap: 5px; padding: 9px 4px; }
  .yt-head { grid-template-areas: "c1 c2 c3 c4 c5"; }
  .yt-head .yt-who, .yt-head .yt-due { display: none; }
  .yt-who { grid-area: who; }
  .yt-due { grid-area: due; }
  .yt-c1 { grid-area: c1; } .yt-c2 { grid-area: c2; } .yt-c3 { grid-area: c3; } .yt-c4 { grid-area: c4; } .yt-c5 { grid-area: c5; }
  .yt-c { font-size: 12px; }
  .yt-full { display: none; }
  .yt-short { display: inline; }
  .yt-detail { grid-template-columns: 1fr; padding: 10px 4px 14px; }
  .yt-detail .yap-kv { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .yap-meter i { transition: width .5s cubic-bezier(.2, .7, .2, 1); }
}
</style>

</head>
